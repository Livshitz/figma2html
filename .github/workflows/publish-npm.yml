name: Publish to npm

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch

jobs:
  publish-npm:
    # Comment this out to enable the workflow
    # if: ${{ false }}
    if: ${{ !contains(github.event.head_commit.message, '[skip-ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to checkout the repository AND push the version commit/tag
      # id-token: write # Uncomment if using OIDC for provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history and tags for version bumping
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          # cache: 'bun'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        working-directory: ./
        run: bun install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Build
        run: bun run build

      - name: Bump version and commit changes
        run: |
          # Stage all changes including build artifacts
          git add .
          # Create version bump commit with all changes
          npm version patch --no-git-tag-version
          git add package.json bun.lock
          git commit -m "chore(release): v$(node -p "require('./package.json').version") [skip ci]"

      # The npm token is NOT a per-repo secret — a repo-scoped NPM_TOKEN went stale and every publish
      # since 1.0.4 died on a 404 (npm reports an unauthorized scope as 404, not 403).
      # Pull the canonical token from secrets-broker's secret store at publish time, so rotating it in one
      # place fixes every repo. Same pattern as agentx + claude-revive. Only secret: BROKER_API_KEY.
      - name: Pull NPM_TOKEN from secrets-broker secrets store
        env:
          BROKER_API_KEY: ${{ secrets.BROKER_API_KEY }}
        run: |
          TOKEN=$(curl -fsS -H "Authorization: Bearer $BROKER_API_KEY" \
            "https://secrets-broker.example/api/apps/REDACTED-APP-ID/env/NPM_TOKEN?environment=prod" \
            | jq -r '.value')
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::could not fetch NPM_TOKEN from secrets-broker"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Publish package to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
          # Uncomment for provenance:
          # NPM_CONFIG_PROVENANCE: "true"

      - name: Create and push tag
        run: |
          git tag "v$(node -p "require('./package.json').version")"
          git push --follow-tags 

permissions:
  contents: write